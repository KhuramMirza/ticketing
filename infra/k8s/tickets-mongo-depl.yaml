apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-mongo-depl
spec:
  replicas: 1
  selector: # This is how deployment finds the pods it creates
    matchLabels:
      app: tickets-mongo
  template:
    metadata:
      labels:
        app: tickets-mongo # Label that gets applied to the pod
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tickets-mongo
          image: mongo
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-mongo-srv
spec:
  selector: # Tells service which pods it's going to govern access to using label
    app: tickets-mongo
  ports:
    - name: db
      protocol: TCP
      port: 27017
      targetPort: 27017
